[project]
name = "personakit"
version = "0.2.0"
description = "Explain Qwen3.5 neurons, make persona steering recipes and port them across sizes, on your GPU or Modal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
local = ["torch>=2.5", "transformers>=5.20", "datasets", "numpy", "accelerate"]
modal = ["modal>=1.0"]

[project.scripts]
personakit = "personakit.cli:main"
personakit-runner = "personakit.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
