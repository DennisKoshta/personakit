[project]
name = "personakit"
version = "0.1.0"
description = "Explain Qwen3.5 neurons, make persona steering recipes and port them across sizes, on Modal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["modal>=1.0"]

[project.optional-dependencies]
local = ["torch", "transformers>=5.20", "datasets", "numpy"]

[project.scripts]
personakit = "personakit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
